---

apiVersion: v1
kind: Service
metadata:
  name: aitestmate-postgres-headless
  labels:
    # {{ include "aitestmate-postgres.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: postgres
      protocol: TCP
      port:
        {{ .Values.port }}
      targetPort:
        {{ .Values.port }}
  selector:
    # {{ include "aitestmate-postgres.selectorLabels" . | nindent 4 }}
